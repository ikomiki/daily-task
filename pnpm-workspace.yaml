packages:
  - "apps/*"
  - "packages/*"

# pnpm 11+ は postinstall スクリプトをデフォルトでブロックする。
# 許可するパッケージは下部の allowBuilds セクションで明示する（pnpm 11+の新書式）。

# サプライチェーン攻撃対策: 公開直後のパッケージはインストールしない（cooldown）。
# pnpm 11.0+ の既定は 1440（1日）。直近の npm 攻撃事例の多くは 24〜48 時間以内に
# 検知・引き下げされるため、3日（4320分）に強化して検出猶予を確保する。
# 緊急ホットフィックスを使う必要が出たら minimumReleaseAgeExclude に
# `name@version`（例: `nx@21.6.5`）を追加して個別解除する。
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@types/node@25.6.2"

catalog:
  # React
  react: ^19.0.0
  react-dom: ^19.0.0
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0

  # ビルド/バンドル
  vite: ^7.0.0
  "@vitejs/plugin-react": ^5.0.0

  # スタイリング
  tailwindcss: ^4.0.0
  "@tailwindcss/vite": ^4.0.0

  # 状態管理 / バリデーション
  zod: ^4.0.0
  "@legendapp/state": ^3.0.0

  # ルーティング（M1 は code-based のみ。file-based 移行時に @tanstack/router-plugin を追加）
  "@tanstack/react-router": ^1.0.0

  # Supabase
  "@supabase/supabase-js": ^2.0.0

  # PWA / Service Worker
  "vite-plugin-pwa": ^1.0.0
  "workbox-window": ^7.0.0

  # テスト
  vitest: ^3.0.0
  "@vitest/ui": ^3.0.0
  "@testing-library/react": ^16.0.0
  "@testing-library/jest-dom": ^6.0.0
  "@testing-library/user-event": ^14.0.0
  jsdom: ^26.0.0
  "@playwright/test": ^1.50.0

  # Linter/Formatter
  "@biomejs/biome": ^2.0.0

  # TypeScript
  typescript: ~5.9.2

# ネイティブバイナリ配置/コンパイルのため build script を許可するパッケージ
allowBuilds:
  "@swc/core": true
  esbuild: true
  nx: true
